services:

  # =========================================================
  # KONG - PUBLIC API GATEWAY
  # =========================================================
  - type: web
    name: kong-gateway
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./kong/Dockerfile
    dockerContext: ./kong
    autoDeployTrigger: commit

    envVars:
      - key: KONG_DATABASE
        value: "off"

      - key: KONG_DECLARATIVE_CONFIG
        value: /kong/declarative/kong.yml

      - key: PORT
        value: "8000"

      - key: KONG_PROXY_LISTEN
        value: "0.0.0.0:8000"

      - key: KONG_ADMIN_LISTEN
        value: "off"

      - key: KONG_PROXY_ACCESS_LOG
        value: /dev/stdout

      - key: KONG_PROXY_ERROR_LOG
        value: /dev/stderr

      # =====================================================
      # PUBLIC URLs OF BACKEND SERVICES
      # =====================================================

      - key: AUTH_SERVICE_URL
        value: "https://auth-service-tmlf.onrender.com"

      - key: COURSE_SERVICE_URL
        value: "https://course-service-4xtw.onrender.com"

      - key: QUIZ_SERVICE_URL
        value: "https://quiz-service-fjr9.onrender.com"

      - key: PROGRESS_SERVICE_URL
        value: "https://progress-service-edqd.onrender.com"

      # =====================================================
      # KONG RESOURCE LIMITS
      # =====================================================

      - key: KONG_NGINX_WORKER_PROCESSES
        value: "1"

      - key: KONG_NGINX_WORKER_CONNECTIONS
        value: "256"


  # =========================================================
  # AUTH SERVICE
  # =========================================================
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: ./auth-service
    autoDeployTrigger: commit

    envVars:

      - key: PORT
        value: "4001"

      - key: DATABASE_URL
        fromDatabase:
          name: dsa-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: dsa-redis
          type: keyvalue
          property: connectionString

      - key: JWT_SECRET
        generateValue: true


  # =========================================================
  # COURSE SERVICE
  # =========================================================
  - type: web
    name: course-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./course-service/Dockerfile
    dockerContext: ./course-service
    autoDeployTrigger: commit

    envVars:

      - key: PORT
        value: "4002"

      - key: DATABASE_URL
        fromDatabase:
          name: dsa-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: dsa-redis
          type: keyvalue
          property: connectionString


  # =========================================================
  # QUIZ SERVICE
  # =========================================================
  - type: web
    name: quiz-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./quiz-service/Dockerfile
    dockerContext: ./quiz-service
    autoDeployTrigger: commit

    envVars:

      - key: PORT
        value: "4003"

      - key: DATABASE_URL
        fromDatabase:
          name: dsa-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: dsa-redis
          type: keyvalue
          property: connectionString


  # =========================================================
  # PROGRESS SERVICE
  # =========================================================
  - type: web
    name: progress-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./progress-service/Dockerfile
    dockerContext: ./progress-service
    autoDeployTrigger: commit

    envVars:

      - key: PORT
        value: "4004"

      - key: DATABASE_URL
        fromDatabase:
          name: dsa-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: dsa-redis
          type: keyvalue
          property: connectionString

      # Progress -> Auth
      # Use public URL because Auth is also a Free web service.

      - key: AUTH_SERVICE_URL
        value: "https://auth-service-tmlf.onrender.com"


  # =========================================================
  # FRONTEND - STATIC SITE
  # =========================================================
  - type: web
    name: dsa-frontend
    runtime: static

    staticPublishPath: ./frontend

    buildCommand: bash frontend/build.sh

    autoDeployTrigger: commit

    envVars:

      # Frontend -> Kong

      - key: API_BASE_URL
        value: "https://kong-gateway-00v6.onrender.com"


  # =========================================================
  # REDIS / KEY VALUE
  # =========================================================
  - type: keyvalue
    name: dsa-redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []


databases:

  # =========================================================
  # POSTGRESQL
  # =========================================================
  - name: dsa-postgres
    plan: free
    region: singapore
    databaseName: dsalearning
    user: dsauser
    ipAllowList: []