_format_version: "3.0"
_transform: true

services:

  # =========================================================
  # AUTH SERVICE -> /auth/* and /internal/*
  # =========================================================
  - name: auth-service
    url: __AUTH_SERVICE_URL__
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: internal-auth-service
    url: __AUTH_SERVICE_URL__
    routes:
      - name: internal-auth-route
        paths:
          - /internal
        strip_path: false

  # =========================================================
  # COURSE SERVICE -> /courses/*
  # =========================================================
  - name: course-service
    url: __COURSE_SERVICE_URL__
    routes:
      - name: course-route
        paths:
          - /courses
        strip_path: false

  # =========================================================
  # QUIZ SERVICE -> /quizzes/*
  # =========================================================
  - name: quiz-service
    url: __QUIZ_SERVICE_URL__
    routes:
      - name: quiz-route
        paths:
          - /quizzes
        strip_path: false

  # =========================================================
  # PROGRESS SERVICE -> /progress/*
  # =========================================================
  - name: progress-service
    url: __PROGRESS_SERVICE_URL__
    routes:
      - name: progress-route
        paths:
          - /progress
        strip_path: false


# =========================================================
# GLOBAL PLUGINS
# =========================================================

plugins:

  # CORS — allows the Render static frontend
  # to communicate with the Kong gateway.
  - name: cors
    config:
      origins:
        - "*"

      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      headers:
        - Authorization
        - Content-Type

      credentials: false
      preflight_continue: false