_format_version: "3.0"
_transform: true

services:

  # =========================================================
  # AUTH SERVICE  ->  /auth/*  and  /internal/*
  # =========================================================
  - name: auth-service
    url: http://__AUTH_SERVICE_HOSTPORT__
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: false

  - name: internal-auth-service
    url: http://__AUTH_SERVICE_HOSTPORT__
    routes:
      - name: internal-auth-route
        paths:
          - /internal
        strip_path: false

  # =========================================================
  # COURSE SERVICE  ->  /courses/*
  # =========================================================
  - name: course-service
    url: http://__COURSE_SERVICE_HOSTPORT__
    routes:
      - name: course-route
        paths:
          - /courses
        strip_path: false

  # =========================================================
  # QUIZ SERVICE  ->  /quizzes/*
  # =========================================================
  - name: quiz-service
    url: http://__QUIZ_SERVICE_HOSTPORT__
    routes:
      - name: quiz-route
        paths:
          - /quizzes
        strip_path: false

  # =========================================================
  # PROGRESS SERVICE  ->  /progress/*
  # =========================================================
  - name: progress-service
    url: http://__PROGRESS_SERVICE_HOSTPORT__
    routes:
      - name: progress-route
        paths:
          - /progress
        strip_path: false

# =========================================================
# GLOBAL PLUGINS
# =========================================================
plugins:
  # CORS — lets the browser SPA (hosted on a separate Render
  # static site) call this Kong gateway cross-origin.
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: false
      preflight_continue: false
